<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Checkout — LyMe Coffe &amp; Eatery</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="commerce.css?v=20261101-official"><script type="module" src="checkout.js?v=20261101-official"></script></head><body><header><a class="logo" href="./">lyme.</a><nav><a href="./#menu">Menu</a><a href="transaksi.html">Transaksi saya</a></nav></header><main><p class="eyebrow">SEDIKIT LAGI, SIAP DINIKMATI</p><h1>Selesaikan <em>pesananmu.</em></h1><p id="status" role="status">Menyiapkan checkout…</p><div class="checkout-layout" id="checkout" hidden><section class="panel"><h2>Detail pemesan</h2><form id="checkout-form"><label for="customer-name">Nama pemesan</label><input id="customer-name" required maxlength="80" autocomplete="name"><label for="service">Jenis pesanan</label><select id="service"><option value="dine-in">Makan / minum di tempat</option><option value="takeaway">Bawa pulang</option></select><div id="table-wrap"><label for="table">Nomor / nama meja</label><input id="table" required maxlength="20" placeholder="Contoh: 5"></div><label for="order-note">Catatan pesanan (opsional)</label><textarea id="order-note" maxlength="500" placeholder="Keterangan tambahan untuk kasir…"></textarea><label for="payment-method">Metode pembayaran</label><select id="payment-method" required></select><p class="notice" id="payment-help"></p><label class="check"><input id="confirm-order" type="checkbox" required> Saya sudah memeriksa menu, jumlah, dan total pesanan.</label><button class="wide" id="place-order" type="submit">Buat pesanan</button><p class="hint">Pesanan dikirim ke kasir. Untuk QR dan transfer, instruksi pembayaran muncul setelah pesanan berhasil dibuat. Cash dibayar di kasir.</p></form></section><aside class="panel"><h2>Ringkasan pesanan</h2><div id="summary"></div><a href="./#menu">← Ubah keranjang</a></aside></div></main></body></html>
